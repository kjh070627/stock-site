<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>종목 분석</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f4f6;--card:#fff;--tx:#191f28;--sub:#6b7684;--line:#e5e8eb;--blue:#3182f6;--bluel:#e8f3ff;--bar:#cfe3ff;--up:#f04452;--down:#3182f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101012;--card:#1b1c21;--tx:#f2f4f6;--sub:#9ea4ad;--line:#2b2d33;--bluel:#1b2a40;--bar:#2a3d5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101012;--card:#1b1c21;--tx:#f2f4f6;--sub:#9ea4ad;--line:#2b2d33;--bluel:#1b2a40;--bar:#2a3d5c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 16px}
.top b{font-size:18px}
.pill{border:0;background:var(--bluel);color:var(--blue);font:500 14px inherit;font-family:inherit;padding:9px 14px;border-radius:999px;cursor:pointer}
.pill:focus-visible,.tab:focus-visible,.more:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{background:var(--card);border-radius:20px;padding:22px 20px;margin-bottom:12px}
.chip{display:inline-block;background:var(--bg);color:var(--sub);font-size:13px;padding:3px 10px;border-radius:999px;margin-right:6px}
h1{font-size:22px;margin:10px 0 2px}
.lbl{color:var(--sub);font-size:14px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.chg{font-size:15px;font-weight:500}
.up{color:var(--up)}.down{color:var(--down)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid .card{margin:0;padding:18px 18px}
.grid .v{font-size:24px;font-weight:700;margin:2px 0}
h2{font-size:17px;margin:0 0 14px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.tab{border:0;background:var(--bg);color:var(--sub);font:500 14px inherit;font-family:inherit;padding:8px 14px;border-radius:999px;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{background:var(--tx);color:var(--card)}
svg{width:100%;height:auto;display:block}
.bar{fill:var(--bar)}.bar.last{fill:var(--blue)}
.t{fill:var(--sub);font-size:13px;text-anchor:middle}.t.val{fill:var(--tx);font-weight:700}
ul.sig{list-style:none;margin:0;padding:0}
ul.sig li{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
ul.sig li:first-child{border-top:0;padding-top:0}
ul.sig i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:9px}
.empty{background:var(--bg);border-radius:14px;padding:18px;color:var(--sub);font-size:14px}
.sum{font-size:15px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.sum.open{display:block}
.more{border:0;background:none;color:var(--blue);font:500 14px inherit;font-family:inherit;padding:10px 0 0;cursor:pointer}
.note{color:var(--sub);font-size:13px;text-align:center;padding:12px 8px}
.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1;min-width:0;border:0;background:var(--card);color:var(--tx);font:500 16px inherit;font-family:inherit;padding:14px 16px;border-radius:14px}.search input:focus-visible{outline:2px solid var(--blue)}.search .pill{padding:0 20px;border-radius:14px;background:var(--blue);color:#fff}
#err{color:var(--up);font-size:14px;padding:0 4px 10px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>종목 분석</b></div>
  <form class="search" id="sf"><input id="q" placeholder="티커를 입력해요 (예: AAPL, MSFT)" autocomplete="off" autocapitalize="characters" aria-label="티커 검색"><button class="pill" type="submit">검색</button></form>
  <div id="err" role="alert"></div>
  <div class="card">
    <div><span class="chip" id="tk"></span><span class="chip" id="sec"></span></div>
    <h1 id="nm"></h1>
    <div class="lbl" id="rl"></div>
    <div class="big" id="rv"></div>
    <div class="chg" id="rg"></div>
  </div>
  <div class="grid" id="mets"></div>
  <div class="card">
    <h2>연도별 추이</h2>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="chart"></div>
  </div>
  <div class="card"><h2>재무에서 보이는 해자 신호</h2><ul class="sig" id="sig"></ul></div>
  <div class="card"><h2>AI 해자 분석</h2><div class="empty">아직 분석이 없어요. 10-K 요약을 연결하면 경쟁우위와 위험 요인이 여기에 표시돼요.</div></div>
  <div class="card" id="bc"><h2>사업 소개</h2><p class="sum" id="sm"></p><button class="more" id="mb">더 보기</button></div>
  <div class="note">참고용 정보이며 투자 조언이 아니에요. 데이터는 SEC 공시 기반이며 회사마다 항목 분류가 달라 틀리거나 비어 있을 수 있어요.</div>
</div>
<script>
var DATA={"ticker":"AAPL","name":"Apple Inc.","sector":"Technology",
"summary":"Apple Inc. designs, manufactures, and markets smartphones, personal computers, tablets, wearables, and accessories. The company offers iPhone, Mac, iPad, and wearables, home, and accessories. It also provides advertising, AppleCare, cloud, and payment services, and operates the App Store and subscription services such as Apple Music and Apple TV. Apple Inc. was founded in 1976 and is headquartered in Cupertino, California.",
"revenue":{"2026":478834000000,"2025":416161000000,"2024":391035000000,"2023":383285000000},
"gross_margin_pct":{"2026":48.8,"2025":46.9,"2024":46.2,"2023":44.1},
"operating_margin_pct":{"2026":33.0,"2025":32.0,"2024":31.5,"2023":29.8},
"roe_pct":{"2026":117.9,"2025":151.9,"2024":164.6,"2023":156.1},
"debt_to_equity_pct":{"2026":71.5,"2025":133.8,"2024":187.2,"2023":178.8}};
var M=[{k:"gross_margin_pct",n:"매출총이익률"},{k:"operating_margin_pct",n:"영업이익률"},{k:"roe_pct",n:"ROE"},{k:"debt_to_equity_pct",n:"부채비율"}];
var $=function(i){return document.getElementById(i)};
var ys=function(o){return Object.keys(o||{}).sort()};
var pct=function(v){return v.toFixed(1)+"%"};
var eok=function(v){return Math.round(v/1e8).toLocaleString("ko-KR")+"억 달러"};
function delta(a,b,unit){var d=b-a,c=d>=0?"up":"down";return '<span class="chg '+c+'">'+(d>=0?"+":"")+d.toFixed(1)+unit+'</span>'}
function chart(o,f){
  var y=ys(o),n=y.length;if(!n){$("chart").innerHTML='<div class="empty">데이터가 없어요.</div>';return}
  var vals=y.map(function(k){return o[k]}),mx=Math.max.apply(null,vals.concat([1])),slot=560/n,bw=Math.min(72,slot*.6),s='<svg viewBox="0 0 600 230" role="img" aria-label="연도별 막대 그래프">';
  y.forEach(function(k,i){var h=Math.max(0,o[k])/mx*140,x=20+slot*i+(slot-bw)/2,last=i===n-1;
    s+='<rect class="bar'+(last?" last":"")+'" x="'+x+'" y="'+(185-h)+'" width="'+bw+'" height="'+h+'" rx="8"/>';
    s+='<text class="t val" x="'+(x+bw/2)+'" y="'+(177-h)+'">'+f(o[k])+'</text><text class="t" x="'+(x+bw/2)+'" y="210">'+k+'</text>'});
  $("chart").innerHTML=s+"</svg>"}
function tabs(d){
  var T=[{n:"매출",o:d.revenue,f:function(v){return Math.round(v/1e8).toLocaleString("ko-KR")}}].concat(M.map(function(m){return{n:m.n,o:d[m.k],f:pct}}));
  $("tabs").innerHTML="";
  T.forEach(function(t,i){var b=document.createElement("button");b.className="tab";b.textContent=t.n;b.setAttribute("role","tab");
    b.setAttribute("aria-selected",i===0);b.onclick=function(){[].forEach.call($("tabs").children,function(c){c.setAttribute("aria-selected",c===b)});chart(t.o,t.f)};$("tabs").appendChild(b)});
  chart(T[0].o,T[0].f)}
function signals(d){
  var s=[],y=ys(d.operating_margin_pct),o=d.operating_margin_pct,g=d.gross_margin_pct,r=d.roe_pct,v=ys(d.revenue),rv=d.revenue;
  if(y.length>1)s.push("영업이익률이 "+pct(o[y[0]])+"에서 "+pct(o[y[y.length-1]])+"로 "+(o[y[y.length-1]]>=o[y[0]]?"올랐어요. 수익성이 유지되거나 개선되는 흐름이에요.":"내렸어요. 경쟁이나 비용 부담이 커졌는지 확인해 보세요."));
  var gy=ys(g);if(gy.length)s.push("매출총이익률은 최근 "+pct(g[gy[gy.length-1]])+"예요. 40%를 넘으면 가격 결정력이나 높은 부가가치 사업이 있다는 힌트가 될 수 있어요.");
  if(v.length>1){var c=Math.pow(rv[v[v.length-1]]/rv[v[0]],1/(v.length-1))-1;s.push("매출은 연평균 "+(c*100).toFixed(1)+"% 성장했어요.")}
  var ry=ys(r);if(ry.length&&r[ry[ry.length-1]]>100)s.push("ROE가 100%를 넘어요. 사업이 매우 효율적일 수도 있지만 자사주 매입으로 자기자본이 줄어 수치가 커졌을 수도 있어서 마진과 함께 봐야 해요.");
  $("sig").innerHTML=s.map(function(t){return"<li><i></i><span>"+t+"</span></li>"}).join("")||'<li><span>계산할 데이터가 부족해요.</span></li>'}
function render(d){
  $("tk").textContent=d.ticker;$("sec").textContent=d.sector||"업종 정보 없음";$("nm").textContent=d.name||d.ticker;
  var v=ys(d.revenue),L=v[v.length-1];$("rl").textContent=L+"년 매출";
  $("rv").textContent=L?eok(d.revenue[L]):"-";
  $("rg").innerHTML=v.length>1?'전년 대비 <span class="'+(d.revenue[L]>=d.revenue[v[v.length-2]]?"up":"down")+'">'+(((d.revenue[L]/d.revenue[v[v.length-2]])-1)*100).toFixed(1)+"%</span>":"";
  $("mets").innerHTML=M.map(function(m){var o=d[m.k]||{},y=ys(o),l=y[y.length-1];
    return'<div class="card"><div class="lbl">'+m.n+'</div><div class="v">'+(l?pct(o[l]):"-")+'</div>'+(y.length>1?delta(o[y[y.length-2]],o[l],"%p"):"")+"</div>"}).join("");
  tabs(d);signals(d);$("sm").textContent=d.summary||"";$("bc").style.display=d.summary?"":"none";$("sm").classList.remove("open");$("mb").textContent="더 보기"}
$("mb").onclick=function(){var o=$("sm").classList.toggle("open");this.textContent=o?"접기":"더 보기"};
async function search(t){
  t=t.trim().toUpperCase();if(!t)return;
  var b=document.querySelector(".search .pill");b.disabled=true;b.textContent="불러오는 중";$("err").style.display="none";
  try{var r=await fetch("/api/stock?ticker="+encodeURIComponent(t)),d=await r.json();
    if(!r.ok)throw new Error(d.error||"불러오지 못했어요");render(d);history.replaceState(null,"","?t="+t)}
  catch(x){$("err").textContent=x.message;$("err").style.display="block"}
  b.disabled=false;b.textContent="검색"}
$("sf").onsubmit=function(e){e.preventDefault();search($("q").value)};
var p=new URLSearchParams(location.search).get("t");if(p){$("q").value=p;search(p)}
render(DATA);
</script>
</body>
</html>
